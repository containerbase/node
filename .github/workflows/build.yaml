name: build

on:
  push:
    branches:
      - main

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
  OWNER: ${{ github.repository_owner }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@17cfc1f65e88b501070eedd892e8f4f176b4c189 # v5.4.17
        with:
          save-cache: true

      # shellcheck is used by jactionlint for the `run` scripts
      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: jactionlint shellcheck zizmor

      - run: pnpm oxfmt

      - name: shellcheck
        uses: reviewdog/action-shellcheck@950c9d71535c8c49e5c029c33a438ade63b9009c # v1.35.1
        with:
          fail_level: any
          reporter: github-pr-annotations
          filter_mode: nofilter
          path: |
            bin
            .husky
          pattern: |
            *.sh
          check_all_files_with_shebangs: 'true'

      - name: Check workflow files
        run: mise exec -- jactionlint --color

      - name: Run zizmor
        run: mise exec -- zizmor --format github .github/
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs:
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Docker registry login
        if: env.DRY_RUN == 'false'
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${OWNER}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to ghcr.io
        uses: containerbase/internal-tools@17cfc1f65e88b501070eedd892e8f4f176b4c189 # v5.4.17
        with:
          command: docker-builder
          platforms: linux/amd64,linux/arm64
          image-prefix: ghcr.io/${{ env.OWNER }}
          major-minor: false
          dry-run: ${{ env.DRY_RUN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Init
        run: ./bin/init.sh

      - name: Release
        if: env.DRY_RUN == 'false'
        run: |
          notes="See https://github.com/nodejs/node/releases/tag/v${VERSION} for more changes"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release edit "v${VERSION}" --title "${VERSION}" --notes "${notes}"
          else
            gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "${VERSION}" --notes "${notes}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
